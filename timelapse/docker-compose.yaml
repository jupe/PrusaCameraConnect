services:
  print-timelapse:
    image: ghcr.io/jupe/prusacameraconnect-timelapse:main
    build: .   # remove to use the published image only
    restart: unless-stopped
    # Site-specific values (printer IP, password, camera URL) go in .env,
    # which is gitignored. Copy .env.example to .env and edit it.
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Helsinki}
      HTTP_PORT: ${HTTP_PORT:-8099}
    ports:
      # history.json + videos/thumbnails, e.g. for a Home Assistant dashboard
      - "${HTTP_PORT:-8099}:${HTTP_PORT:-8099}"
    volumes:
      - ./timelapses:/data
